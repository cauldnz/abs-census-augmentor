name: tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Verify ruff format
        run: uv run ruff format --check .

      - name: Type-check with mypy
        run: uv run mypy src/ tools/ tests/

      - name: Run pytest
        run: uv run pytest tests/ -q

      # Wheel-install regression check (issue #19). Builds a wheel,
      # installs it into a fresh subprocess venv, and asserts both
      # registries populate from the bundled markdown alone. Gated on
      # WHEEL_E2E=1 because it's slow (~10s) and only meaningful when
      # the build toolchain is available — local `pytest` skips it.
      - name: Verify wheel ships dataset/feature specs (issue #19 regression)
        env:
          WHEEL_E2E: "1"
        run: |
          uv pip install build
          uv run pytest tests/test_wheel_bundles_specs.py -v
