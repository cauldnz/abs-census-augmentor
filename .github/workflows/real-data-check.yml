# Weekly real-data parser check.
#
# Runs `tools/fetch_real_data.py` + `tools/verify_real_parsers.py`
# against the live ABS / data.gov.au / G-NAF endpoints and opens a
# GitHub issue on failure. This is the scheduled counterpart to the
# `make verify-real` target — it catches the "ABS published a new
# release with a renamed column" / "landing page HTML restructured"
# class of failure the day it lands, rather than waiting for someone
# to bump into it locally.
#
# Why a cron rather than per-PR:
#
# - ABS publications are slow-moving; daily would be overkill, weekly
#   catches drift within a sensible response window.
# - PR CI shouldn't depend on a live upstream — that turns flaky
#   ABS into red builds for unrelated PRs.
# - `workflow_dispatch` exposes a "Run workflow" button for manual
#   re-checks when investigating drift suspicions.
#
# Skips G-NAF (the 10 GB cache mode) — too expensive for CI minutes
# and the gnaf-loader S3 bucket has its own monitoring upstream.
# Real-data CI here covers ABS / data.gov.au — the bits we own the
# parser for. Local `make verify-real` exercises G-NAF when a
# maintainer wants it.

name: Real-data parser check

on:
  schedule:
    # Weekly: Monday 04:00 UTC (~14:00 AEST). Picks a quiet time to
    # avoid colliding with ABS publication cadence (usually Tue/Thu).
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    name: Run real-data parsers
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install project + dev deps
        run: uv sync --all-extras

      - name: Fetch real ABS data
        # Skip G-NAF (10 GB) — see header comment.
        run: uv run python tools/fetch_real_data.py --skip-gnaf

      - name: Verify parsers against real data
        run: uv run python tools/verify_real_parsers.py

  on-failure:
    name: Open issue on failure
    needs: verify
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Open or update tracking issue
        uses: actions/github-script@v9
        with:
          script: |
            // Single rolling issue per ABS-drift event. If a stale
            // open issue from last week is still around, comment on
            // it rather than spamming a duplicate.
            const title = 'Real-data parser check failed';
            const body = [
              'The scheduled real-data parser check failed.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Most likely cause: ABS / data.gov.au published a new',
              'release whose schema diverges from what our parsers',
              'expect. Common drift patterns: a renamed GCP column',
              'in the metadata XLSX, a restructured ERP / ATO landing',
              'page, a new DSS CKAN resource format.',
              '',
              'Investigation steps:',
              '1. Open the failed run and read the `verify_real_parsers.py`',
              '   ticks/crosses — the failure line names which parser.',
              '2. Fetch the failing artefact locally:',
              '   `uv run python tools/fetch_real_data.py --skip-gnaf`.',
              '3. Re-run the parser against the new file and patch the',
              '   schema-divergence as per CLAUDE.md\'s Real Data First',
              '   rule.',
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'real-data-drift',
            });

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body: body,
              });
              console.log(`Commented on existing issue #${existing[0].number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['real-data-drift'],
              });
              console.log(`Opened issue #${created.number}`);
            }
