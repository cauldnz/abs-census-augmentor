# PR validation: re-render every demo GIF and upload as artifacts.
#
# Triggered on PRs that touch anything that could change what the
# demos show — tape files, the CLI entry point, registered
# dataset / PRESET specs. Avoids the cost of a multi-minute render on
# every documentation-only or unrelated-source PR.
#
# Output: a `demo-renders` artifact containing the GIFs + per-scene
# PNGs. Reviewers can download it to see the visual delta a PR would
# produce. Nothing gets committed — `demo-publish.yml` is the manual
# workflow that lands refreshed renders on `main`.
#
# Designed in issue #38. ABS-cache + paths tightening landed under the
# BACKLOG "Slow `Render demos` CI workflow" entry: see CHANGELOG for
# the rationale.

name: Render demos

on:
  pull_request:
    branches: [main]
    paths:
      # Tape edits / config tweaks / Sleep adjustments
      - "tools/demo/**"
      # CLI surface / output prompt strings can appear in scenes.
      # NOTE: pipeline.py / enrich.py are deliberately *not* listed —
      # internal-orchestration edits there rarely change anything the
      # demos show. Re-run on demand via workflow_dispatch when a PR
      # touches those AND you genuinely care about the visual delta.
      - "src/census_augment/cli.py"
      # Registered datasets + PRESETs surface in `discover` output
      - "datasets/**.md"
      - "features/**.md"
      # The workflows themselves
      - ".github/workflows/demo-render.yml"
      - ".github/actions/install-render-deps/action.yml"
  # Allow manual re-run from the Actions tab without opening a PR.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Render and upload artifact
    runs-on: ubuntu-latest
    # Render takes ~5-7 minutes (3 tape pre-warms + parallel render).
    # 20 minutes gives ample headroom for ABS download slowness.
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install render dependencies
        uses: ./.github/actions/install-render-deps

      - name: Install project + dev deps
        run: uv sync --all-extras

      # ABS data pre-warm cache. The render script downloads the SA2
      # boundary ZIP (~50 MB) + GCP DataPack ZIP (~50 MB) + each
      # registered-dataset XLSX before it can render. Caching this
      # cuts 30-60 seconds off every run that hits a warm cache, and
      # — more importantly — keeps the workflow tolerant of transient
      # ABS download flakes on later commits in a PR.
      #
      # Key strategy:
      # - Primary: hash of pyproject.toml + every YAML config under
      #   tools/demo/ (which together describe the dataset surface
      #   the pre-warm fetches). A dependency bump OR a new demo
      #   config invalidates.
      # - Restore-keys fall back to any prior cache for the same
      #   dependency hash on this OS, so we still get a warm cache
      #   when only the demo YAMLs change.
      # The cache root matches what `platformdirs` resolves to on
      # ubuntu-latest. Render.sh checks the same path before
      # firing `census-augment fetch`, so a warm cache turns the
      # pre-warm into a no-op.
      - name: Cache ABS data pre-warm
        uses: actions/cache@v5
        with:
          path: ~/.cache/census-augment/data
          key: census-augment-abs-cache-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'tools/demo/*.yaml') }}
          restore-keys: |
            census-augment-abs-cache-${{ runner.os }}-

      # Render uses the same `--local` path that the devcontainer
      # uses by default — no Docker, native vhs invocation. The
      # script pre-warms the ABS cache and pre-runs every demo
      # config before invoking vhs.
      - name: Render every tape
        run: ./tools/demo/render.sh --local --all

      # README scene strips are kept in sync by `make demos`. The
      # render script doesn't run the refresh step itself (the
      # Makefile does), so do it here to guarantee artifacts match
      # what would be committed.
      - name: Refresh README scene strips
        run: uv run python tools/demo/refresh_readme_frames.py

      - name: Show render log on failure
        if: failure()
        run: |
          for f in tools/demo/.last-render-*.log; do
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done

      - name: Upload demo artifacts
        uses: actions/upload-artifact@v7
        # `if: always()` so a partial render (e.g. 2 of 3 tapes
        # succeeded) still lets the reviewer download what did render.
        if: always()
        with:
          name: demo-renders
          path: |
            docs/*.gif
            docs/frames/*.png
          retention-days: 14
          if-no-files-found: warn
