[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Distribution name matches the GitHub repo so `pip install ...@git+...`
# and `uv add ...@git+...` work without a name-equality error. The
# import name and CLI command both stay `census_augment` /
# `census-augment` — those are independent of the distribution name.
name = "abs-census-augmentor"
version = "1.4.2"
description = "Augment Australian location datasets with ABS Census data at the SA2 statistical area level."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "typer",
    "geopandas",
    "shapely",
    "pyproj",
    "pyogrio",      # geopandas IO backend; we call it directly to read .dbf attrs without geometry (spec §19.4)
    "pandas",
    "requests",
    "openpyxl",
    "platformdirs",
    # G-NAF support (spec §19, added in v1.0):
    "duckdb",       # G-NAF indexing + FTS, native Parquet reads
    "pyarrow",      # Parquet I/O for G-NAF
    "rapidfuzz",    # Tier 3 fuzzy address matching
    "boto3",        # Anonymous S3 access for G-NAF distribution
    "tqdm",         # Progress bars for the multi-GB G-NAF download
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "responses",
    "moto[s3,server]>=5",   # Hermetic S3 mocking. The 'server' extra adds Flask so ThreadedMotoServer works (used by the remote-mode httpfs tests).
    "ruff",
    "mypy",
    "types-requests",
    "types-PyYAML",
    "pandas-stubs",
]

[project.scripts]
census-augment = "census_augment.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/census_augment"]

# Bundle the dataset / feature spec markdown into the wheel under the
# private mirror paths the runtime fallback code in
# `datasets/_registry.py::_default_spec_dir()` and
# `features.py::_default_features_dir()` expects to find for wheel
# installs (no `datasets/` / `features/` dir at the source root).
# Without these, both registries return empty lists on a real wheel
# install, breaking the pluggable framework end-to-end (issue #19).
# Templates (leading-underscore files) are silently skipped by both
# loaders, so including the whole directory is harmless.
[tool.hatch.build.targets.wheel.force-include]
"datasets" = "census_augment/datasets/_specs"
"features" = "census_augment/_features"

[tool.ruff]
line-length = 100
target-version = "py311"
# Don't descend into Claude Code's agent scratch space. Each
# `.claude/worktrees/<slug>/` is an independent checkout of this
# repo on a different branch (parallel-PR worktree). Letting ruff
# walk them duplicates findings AND lets each worktree's own
# pyproject.toml override on-main rules via nested-config
# discovery. See cauldnz/aus-fuel-forecaster#17.
extend-exclude = [".claude/"]

[tool.mypy]
python_version = "3.11"
strict = true
# Same reason as the ruff extend-exclude above. `mypy src/ tools/`
# in the Makefile already scopes the walk to safe roots, but adding
# the regex exclude makes ad-hoc invocations (`mypy .`) safe too.
exclude = ['^\.claude/']

[tool.pytest.ini_options]
# Anchor test discovery to ./tests so pytest doesn't walk into
# `.claude/worktrees/<slug>/tests/` when invoked from the repo
# root. Same agent-scratch-space concern as the ruff and mypy
# excludes above.
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = [
    "geopandas",
    "geopandas.*",
    "shapely",
    "shapely.*",
    "pyproj",
    "pyproj.*",
    "pyogrio",
    "pyogrio.*",
    "boto3",
    "boto3.*",
    "botocore",
    "botocore.*",
    "tqdm",
    "tqdm.*",
    "openpyxl",
    "openpyxl.*",
]
ignore_missing_imports = true
