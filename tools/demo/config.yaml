# Headline README demo config — mixes Census GCP and SEIFA variables
# in one shot to show the v1.3 pluggable framework in action.
#
# Inputs are lat/lon, so the Nominatim provider is never actually
# invoked — the user_agent below is only here because the config
# validator requires it when 'nominatim' is in `providers`.
#
# PRESETs are intentionally excluded from this demo until issue #23
# lands (PRESET column refs don't match the real GCP DataPack); once
# that's fixed, this config will gain `pct_renters` /
# `pct_drive_to_work` and the headline demo gets to show off
# `PRESET.<id>` too. The preset-features.tape demo is gated on the
# same fix.

input:
  path: tools/demo/input.csv
  latitude_column: lat
  longitude_column: lon

output:
  path: tools/demo/output.csv
  prefix: sa2_

geocoding:
  providers: [nominatim]
  nominatim:
    user_agent: "census-augment-demo/1.4 (demo@example.com)"

variables:
  median_income: G02.Median_tot_hhd_inc_weekly  # GCP DataPack — household income
  median_age:    G02.Median_age_persons         # GCP DataPack — median age
  irsd_decile:   SEIFA.irsd_aus_decile          # SEIFA registered dataset (1=most disadvantaged)
  irsd_score:    SEIFA.irsd_score               # SEIFA score (~600-1200, mean=1000)
